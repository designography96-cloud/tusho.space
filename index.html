<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tusho — Motion designer & creative problem solver</title>
    <meta name="description" content="Motion design, brand design and digital experiences by Tusho. Built in Bangladesh. Trusted globally." />
    <link rel="icon" type="image/svg+xml" href="/tusho.space/assets/favicon-o-2T8M1t_g.svg" />
    <script>
      document.documentElement.dataset.theme =
        (function () { try { return localStorage.getItem('tusho-theme') } catch (e) { return null } })() || 'light'
    </script>
    <script type="module" crossorigin src="/tusho.space/assets/home-Wdgjreub.js"></script>
    <link rel="modulepreload" crossorigin href="/tusho.space/assets/draw-DpJMH_Vp.js">
    <link rel="stylesheet" crossorigin href="/tusho.space/assets/draw-DAj6FuCw.css">
  </head>
  <body data-page="home">
    <main id="main">
      <!-- 1/2 · hero — big logo intro, morphs into the header logo on scroll -->
      <section class="s-hero section container" data-fbname="Hero">
        <span class="hero-logo brand-mark">
          <a class="brand-home" href="./" aria-label="Tusho — home"></a>
          <button class="o-toggle" type="button" aria-label="Switch between dark and light mode"></button>
        </span>
        <p class="hero-tagline t-body"></p>
        <span class="hero-cue" aria-hidden="true">
          <svg viewBox="0 0 18 28" fill="none">
            <rect x="1" y="1" width="16" height="26" rx="8" stroke="currentColor" stroke-width="1.4"/>
            <circle class="hero-cue-dot" cx="9" cy="9" r="1.6" fill="currentColor"/>
          </svg>
        </span>
      </section>

      <!-- 3 · what i do -->
      <section class="s-whatido section container" data-fbname="What I do">
        <div class="section-head">
          <span class="head-label t-label">What I do</span>
        </div>
        <div class="wid-rows"></div>
      </section>

      <!-- 4 · motion works -->
      <section class="s-motion section container" data-fbname="Motion works">
        <div class="section-head">
          <a href="motion.html" aria-label="See all motion works"><h2 class="t-h2 head-link">Motion works</h2></a>
          <span class="head-label t-label">A glimpse</span>
        </div>
        <div class="motion-list"></div>
        <div class="motion-preview" aria-hidden="true">
          <div class="motion-preview-frame">
            <video muted loop playsinline></video>
            <img alt="" />
          </div>
        </div>
        <div class="see-all">
          <a class="btn-line t-label" href="motion.html"><span class="btn-rule"></span>See all motion</a>
        </div>
      </section>

      <!-- 5 · brand works -->
      <section class="s-brand section container" data-fbname="Brand design">
        <div class="section-head">
          <a href="brand.html" aria-label="See all brand design work"><h2 class="t-h2 head-link">Brand design</h2></a>
          <span class="head-label t-label">Up close</span>
        </div>
        <div class="brand-list"></div>
        <div class="see-all" style="display:flex;justify-content:flex-end;margin-top:clamp(48px,10vh,120px)">
          <a class="btn-line t-label" href="brand.html"><span class="btn-rule"></span>See all brand work</a>
        </div>
      </section>

      <!-- 6 · web projects -->
      <section class="s-web section" data-fbname="Website projects">
        <div class="container">
          <div class="section-head">
            <h2 class="t-h2">Website projects</h2>
            <span class="head-label t-label">Directed and built</span>
          </div>
        </div>
        <div class="web-cloud"></div>
        <div class="container">
        <div class="see-all" style="display:flex;justify-content:flex-end;margin-top:clamp(48px,10vh,120px)">
          <a class="btn-line t-label" href="web.html"><span class="btn-rule"></span>See all web</a>
        </div>
        </div>
      </section>

      <!-- 7 · case studies -->
      <section class="s-case section" data-fbname="Case studies">
        <div class="container">
          <div class="section-head">
            <h2 class="t-h2">Case studies</h2>
            <span class="head-label t-label">Problems, solved</span>
          </div>
        </div>
        <div class="case-slider">
          <div class="case-slider-inner"></div>
        </div>
      </section>

      <!-- 8 · how i think -->
      <section class="s-think section container" data-fbname="How I think">
        <div class="section-head">
          <h2 class="t-h2">How I think</h2>
        </div>
        <div class="think-cards"></div>
      </section>

      <!-- 9 · about short -->
      <section class="s-about section container" data-fbname="About">
        <div class="about-grid">
          <div class="about-photo">
            <div class="frame"><img src="/tusho.space/assets/portrait-WXEJfY4N.webp" alt="Portrait of Tusho" loading="lazy" /></div>
          </div>
          <div class="about-text">
            <h2 class="t-h2"></h2>
            <p class="t-body"></p>
            <a class="btn-line t-label about-cta" href="about.html"><span class="btn-rule"></span><span>More about me</span></a>
          </div>
        </div>
      </section>

      <!-- 10 · hobbies -->
      <section class="s-hobbies section container" data-fbname="Hobbies">
        <div class="section-head">
          <h2 class="t-h2 hobby-heading"></h2>
          <span class="head-label t-label">Off the clock</span>
        </div>
        <div class="hobby-panes"></div>
      </section>

      <!-- 11 · footer -->
      <footer class="s-footer section container" data-fbname="Footer">
        <div class="footer-top">
          <div class="footer-contact">
            <a class="footer-email" href="#">
              <span class="email-text"></span>
              <span class="rule rule--stroke email-rule" aria-hidden="true"></span>
            </a>
            <div class="footer-socials"></div>
          </div>
          <form class="footer-form glass">
            <input type="email" class="footer-form-email" placeholder="Your email" aria-label="Your email" required />
            <textarea class="footer-form-message" placeholder="Your message" aria-label="Your message" rows="3" required></textarea>
            <button type="submit" class="btn-line t-label footer-form-submit"><span class="btn-rule"></span>Send</button>
          </form>
        </div>
        <div class="footer-rights t-label">
          <span class="rights-text"></span>
        </div>
      </footer>
    </main>

  </body>
</html>
